<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion / Empire Journals</title><link rel="stylesheet" href="/overlay.css"></head>
<body><main>
<header><div><div class="eyebrow">ORION OBSERVATORY</div><h1>Inside the empires.</h1><p class="subtitle">A record of decisions, ambitions, and consequences.</p></div><div class="signal"><span id="lamp"></span><span id="status">Waiting for engine</span><strong id="date">—</strong></div></header>
<section id="controls" aria-label="Broadcast controls"><label>Follow <select id="empire"><option value="all">All empires</option></select></label><label>Turn spacing <select id="speed"><option value="3000">3 seconds</option><option value="1000">1 second</option><option value="5000">5 seconds</option><option value="10000">10 seconds</option><option value="30000">30 seconds</option><option value="60000">60 seconds</option></select></label><button id="play">Run simulation</button><button id="pause">Pause</button><label class="detail"><input type="checkbox" id="evidence"> Show engine evidence</label></section>
<div id="notice" role="status">Waiting for a journal. Start a single-player game and activate ALLAI.</div>
<section id="journals" aria-label="Empire journals"></section>
<footer><span>ENGINE DECISION JOURNAL · V0.1</span><span>Evaluations ≠ agreements. Outcome entries confirm state changes.</span></footer>
</main><script src="/overlay.js"></script></body></html>
