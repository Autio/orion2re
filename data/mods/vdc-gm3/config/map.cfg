    roll_1:  3 3 3 3 3 3
    roll_2:  3 3 3 3 3 3
    roll_3:  3 3 3 3 3 3
    roll_4:  3 3 3 3 3 3
    roll_5:  3 3 3 3 3 3
    roll_6:  3 3 3 3 3 3
    roll_7:  3 3 3 3 3 3
    roll_8:  3 3 3 3 3 3
    roll_9:  3 3 3 3 3 3
    roll_10: 3 3 3 3 3 3;

