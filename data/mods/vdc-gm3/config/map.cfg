# Star Orbits Satellite types distribution I  II III  IV   V    1 = Asteroid; 2 = Gas Giant;  3 = Planet;
map satellite_type =
    roll_1:  planet planet planet planet planet
    roll_2:  planet planet planet planet planet
    roll_3:  planet planet planet planet planet
    roll_4:  planet planet planet planet planet
    roll_5:  planet planet planet planet planet
    roll_6:  planet planet planet planet planet
    roll_7:  planet planet planet planet planet
    roll_8:  planet planet planet planet planet
    roll_9:  planet planet planet planet planet
    roll_10: planet planet planet planet planet;

# Spectral mineral richness: B, W, Y, O, R, B.
# 0 = ultra poor; 1 = poor; 2 = abundant; 3 = rich; 4 = ultra rich;
map mineral_class =
    roll_1:  abundant poor poor poor poor poor
    roll_2:  abundant poor poor poor poor poor # Each value is a 10% outcome.
    roll_3:  abundant abundant poor poor poor poor # Two entries for a value give it a 20% chance.
    roll_4:  abundant abundant poor poor poor poor
    roll_5:  abundant abundant abundant abundant poor poor
    roll_6:  abundant abundant abundant abundant abundant abundant
    roll_7:  rich abundant abundant abundant abundant abundant
    roll_8:  rich abundant abundant abundant abundant abundant
    roll_9:  ultra_rich rich abundant abundant abundant abundant
    roll_10: ultra_rich rich rich rich rich rich;


