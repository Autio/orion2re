# Star spectral class to environment group: I, II, III, IV, V.
# 00 = bombarded; 01 = hostile; 02 = life supporting; 03 = lifeless;
map environment_group blue =
    orbit_1: life_supporting
    orbit_2: life_supporting
    orbit_3: life_supporting
    orbit_4: life_supporting
    orbit_5: life_supporting;
map environment_group white =
    orbit_1: life_supporting
    orbit_2: life_supporting
    orbit_3: life_supporting
    orbit_4: life_supporting
    orbit_5: life_supporting; # for GM3 star spectrum doesn't matter since all stars belong to life supporting group
map environment_group yellow =
    orbit_1: life_supporting
    orbit_2: life_supporting
    orbit_3: life_supporting
    orbit_4: life_supporting
    orbit_5: life_supporting;
