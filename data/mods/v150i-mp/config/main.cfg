# ==============================
# 1.50 multiplayer configuration
# ==============================

# Package name, identity, class, order, and description are defined in mod.json5.

interface format version = template: "$VERSION$ multiplayer" style: 1 align: r x: 559 y: 432; # Version number on title screen.
interface format mod_name = template: "" style: 1 align: r x: 559 y: 418; # No mod name on title screen.

# COMBAT.LBX and DESIGN.LBX graphics are inherited from v150i.
# SHIPNAME.LBX with the modified ship names is inherited through v150i from v150.
# HERODATA.LBX provides modified tactics leaders in every supported language.
# HELP.LBX and TECHDESC.LBX provide updated English text.
# The legacy multiplayer profile omits the single-player -12-pick KENTEXT replacement.

# IFACE.CFG, AIRACES.CFG, AISHIPS.CFG, ANTS.CFG, and TWEAKS.CFG
# are inherited from v150i.
include PICKS_MP.CFG; # Multiplayer race picks.
include MAP.CFG;      # Multiplayer map.
# MIRROR_HW is declared as a package dependency.

interface confirm_battle_message_timeout = 90; # Timeout for disappearance of following confirmation messages
                                               # in Multiplayer: 'X attacks Y at Z', 'outpost destroyed' and
                                               # 'colony captured by mind control'. Timeout is in ticks.
                                               # Timeout for combat confirmation messages (90 =~5 seconds).
combat boarding auto_close_results = true;     # Raid and capture result pop-ups timeout automatically.

diplomacy noreport = true; # Forbids the Report button and Exchange, Demand, and Offer Technology.

# DEPOSITS.LUA and TECHTREE.LUA are inherited from v150i.

# END