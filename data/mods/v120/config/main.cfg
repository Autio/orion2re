# ==================================
#  SET120: Version 1.2 configuration
# ==================================

# Package name, identity, class, order, and description are defined in mod.json5.

# Restore v1.31 help file to v1.2 (retaining all classic text errors):
# help.lbx is supplied by the package VFS. # only English language help file is updated.

# MAP:
map home_system minimum_planets = 1; # defaults: v1.1-v1.31: 1; v1.40: 2; v1.50: 3.

# Ground Rules:
combat ship_initiative = 0;         # ship initiative is off.
colony zero_colony_lost = false;    # inbound colonists prevent loss of colony that has no buildings and pop.
leaders loknar_gives_no_tech = true; # loknar brings no techs as it was in v1.1 and v1.2.

# Tutor level AI penalty was less in version 1.2:
ai productivity_bonus tutor = -5; # -10

# Creative 6 picks and restore Psilon race to original v1.2 design:
race picks special creative = 6;
ai stock_race psilon =
    large_hw:    false
    hw_richness: 0
    arti_world:  true; # LHW replaced by Arti HW
ai race_variants customization psilon hard 1 =
    count:  2
    traits: large_home_world 1 home_world_richness 1 government 0 government 0
            government 0 government 0 government 0 government 0; # +LHW
ai race_variants customization psilon impossible 2 =
    count:  2
    traits: large_home_world 1 home_world_richness 1 government 0 government 0
            government 0 government 0 government 0 government 0; # +LHW

# Restore 3 weapons to original v1.2 specifications:
design weapon ion_pulse_cannon =
    size:             20
    cost:             15
    min_damage:       2
    max_damage:       14
    strat_min_damage: 2
    strat_max_damage: 14
    available_mods:   hv,co,af;
design weapon plasma_cannon =
    size:             10
    cost:             15
    min_damage:       6
    max_damage:       30
    strat_min_damage: 6
    strat_max_damage: 30;
design weapon gyro_destabilizer =
    size:             50
    cost:             35
    min_damage:       3
    max_damage:       7
    strat_min_damage: 3
    strat_max_damage: 7;

# Damper field does not block marine casualties caused by Neutron Blasters and Death Rays:
combat marine_kill_damage_blocker = none;

# Disable overmap stealth from technology (didn't function in v1.2):
detection stealth_bonus stealth_field = 0;   # first enabled in fan patch 1.40b17
detection stealth_bonus cloaking_device = 0; # first enabled in fan patch 1.40b22
detection stealth_bonus phasing_cloak = 0;   # first enabled in fan patch 1.40b22

# Planet defenses weapon mods:
combat defenses_allowed_mods heavy = hv,pd,co,nr;
combat defenses_allowed_mods normal = hv,pd,co,nr;
combat defenses_allowed_mods pd = hv,pd,co,nr;
combat defenses_allowed_mods missile_torp = nr,env,eccm,arm,fst,ovr;

# Star Base could not have Warp Dissipator in v1.2 (a 13th slot was added in v1.3):
combat starbase_special 6 = security_stations security_stations security_stations; # security_stations
combat starbase_special 7 1 = battle_scanner;
combat starbase_special 8 1 = high_energy_focus;
combat starbase_special 9 1 = structural_analyzer;
combat starbase_special 10 1 = achilles_targeting_unit;
combat starbase_special 11 1 = rangemaster_unit;
combat starbase_special 12 1 = transporters;
combat starbase_special 13 1 = none; # slot 13 was added in v1.3.
combat starbase_special 14 1 = none; # slot 14 was added in v1.50.15.

# table 'special_weapon1' was identical to table 'special_weapon2' in v1.2 (PD -1, identical Doom Star):
ai ship_design_allocations special_weapon frigate =
    theme_special:       -1
    beam_special:        -1
    missile_special:     -1
    defense_special:     15
    special_weapon:      60
    special_device:      -1
    fighter:             -1
    missile:             -1
    heavy_beams:         -1
    beams:               25
    point_defense_beams: -1
    bombs:               0;
ai ship_design_allocations special_weapon destroyer =
    theme_special:       10
    beam_special:        -1
    missile_special:     -1
    defense_special:     5
    special_weapon:      50
    special_device:      -1
    fighter:             -1
    missile:             -1
    heavy_beams:         15
    beams:               10
    point_defense_beams: -1
    bombs:               10;
ai ship_design_allocations special_weapon cruiser =
    theme_special:       15
    beam_special:        -1
    missile_special:     -1
    defense_special:     0
    special_weapon:      45
    special_device:      -1
    fighter:             -1
    missile:             -1
    heavy_beams:         15
    beams:               15
    point_defense_beams: -1
    bombs:               10;
ai ship_design_allocations special_weapon battleship =
    theme_special:       15
    beam_special:        -1
    missile_special:     -1
    defense_special:     5
    special_weapon:      40
    special_device:      -1
    fighter:             -1
    missile:             -1
    heavy_beams:         15
    beams:               15
    point_defense_beams: -1
    bombs:               10;
ai ship_design_allocations special_weapon titan =
    theme_special:       15
    beam_special:        -1
    missile_special:     -1
    defense_special:     10
    special_weapon:      35
    special_device:      -1
    fighter:             -1
    missile:             -1
    heavy_beams:         15
    beams:               15
    point_defense_beams: -1
    bombs:               10;
ai ship_design_allocations special_weapon doomstar =
    theme_special:       15
    beam_special:        -1
    missile_special:     -1
    defense_special:     15
    special_weapon:      30
    special_device:      -1
    fighter:             -1
    missile:             -1
    heavy_beams:         15
    beams:               15
    point_defense_beams: -1
    bombs:               10;
# ai ship_design_allocations special_weapon2 doomstar = 15 -1 -1 15 30 -1 -1 -1 15 15 -1 10;

# Remove the Guardians Compressors that were introduced in v1.3:
ships guardian weapons 5 type = none; # was 13, spatial compressor

